name: SEO agent

on:
  schedule:
    - cron: "0 8,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-agent
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: seo-agent
    env:
      GOOGLE_SERVICE_ACCOUNT_FILE: secrets/service-account.json
      API_TOKEN: ${{ secrets.SEO_API_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check required secrets
        env:
          SEO_API_TOKEN: ${{ secrets.SEO_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          missing=
          for v in SEO_API_TOKEN DEEPSEEK_API_KEY GOOGLE_SA_JSON; do
            if [ -z "${!v}" ]; then echo "Secret GitHub mancante o vuoto: $v"; missing=1; fi
          done
          if [ -z "$missing" ] && ! node -e 'JSON.parse(process.env.GOOGLE_SA_JSON)'; then
            echo "GOOGLE_SA_JSON non e' JSON valido"; missing=1
          fi
          exit ${missing:-0}

      - name: Write Google service account key
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$GOOGLE_SA_JSON" > secrets/service-account.json

      - name: Run SEO cron
        env:
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
          BOT_GROUP_JID: ${{ secrets.BOT_GROUP_JID }}
        run: node src/index.mjs cron

      - name: Persist agent memory
        if: always()
        run: |
          git config user.name "seo-agent-bot"
          git config user.email "seo-agent-bot@users.noreply.github.com"
          git add data/memory
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): aggiorna memoria agente [skip ci] [vercel skip]"
            git pull --rebase
            git push
          fi
