name: SEO orphan pages (manuale)

# Solo esecuzione manuale: esplora il sito con un browser headless e segnala le URL in sitemap
# che non ricevono alcun link interno. Non invia WhatsApp, non salva lo stato.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orphans:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: seo-agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: seo-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Find orphan pages
        run: node src/index.mjs orphans
